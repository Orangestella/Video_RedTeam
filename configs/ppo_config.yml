model:
  # PPO trains from the SFT-merged full model, then attaches a fresh PPO LoRA
  # adapter. The original SFT adapter is not updated during PPO.
  model_path: "./checkpoints/sft_merged"
  # This is LoRA-on-merged-SFT. Keep -1 so trlx does not freeze adapter modules
  # after PEFT has already frozen the merged base model.
  num_layers_unfrozen: -1
  peft_config:
    peft_type: "LORA"
    task_type: "CAUSAL_LM"
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    bias: "none"
  model_extra_configs:
    attn_implementation: "eager"

tokenizer:
  # Use the base Llama tokenizer. The SFT adapter directory may contain a
  # TokenizersBackend tokenizer_config that only works in one custom env.
  tokenizer_path: "./checkpoints/Meta-Llama-3-8B-Instruct"
  padding_side: "left"
  truncation_side: "right"
  tokenizer_extra_configs:
    pad_token: "<|eot_id|>"

# Optimizer / scheduler / training-length controls.
# TEAR paper § 4.1 pins the online-RL stage to: AdamW, LR 1e-6, gamma=1.0,
# lam=0.95, cosine scheduler. It does NOT pin the number of training rounds,
# steps, batches, or epochs — those are budget choices left to the user.
optimizer:
  name: "adamw"
  kwargs:
    lr: 1.0e-6           # paper-pinned
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8

scheduler:
  name: "cosine_annealing"   # paper-pinned schedule shape
  kwargs:
    # T_max should track train.total_steps for a full cosine sweep down to eta_min.
    T_max: 500
    eta_min: 1.0e-7

train:
  seq_length: 256
  # The paper does not specify a total step / epoch budget for the PPO stage.
  # IMPORTANT: trlx ``epochs`` = rollout refresh cycles (each pulls
  # ``method.num_rollouts`` prompts), NOT one pass over the JSON file.
  # With full_dataset: true, epochs & total_steps are auto-set from data_path size.
  full_dataset: true
  epochs: 3
  total_steps: 500
  batch_size: 1
  # max_batches: null disables the artificial early-stop in reward_fn so PPO
  # runs for the full `total_steps` above (paper does not impose a batch cap).
  # Set to a positive integer only if you need a hard wall-clock safety stop.
  max_batches: null
  trainer: "AcceleratePPOTrainer"
  tracker: null
  checkpoint_interval: 500
  eval_interval: 64
  pipeline: "PromptPipeline"
  checkpoint_dir: "./checkpoints/ppo"
  logging_dir: "./runs/log_dir"

accelerate:
  compute_environment: "LOCAL_MACHINE"
  distributed_type: "NO"
  downcast_bf16: "no"
  gpu_ids: "0"
  machine_rank: 0
  main_training_function: "main"
  mixed_precision: "bf16"
  num_machines: 1
  num_processes: 1
  rdzv_backend: "static"
  same_network: true
  tpu_env: []
  tpu_use_cluster: false
  tpu_use_sudo: false
  use_cpu: false

video:
  # Data
  data_path: "./data/ppo_data.json"

  # SFT bootstrap for PPO:
  # 1) Merge this SFT LoRA adapter into the base model once.
  # 2) Train a new PPO LoRA adapter on top of the merged SFT model.
  base_model_path: "./checkpoints/Meta-Llama-3-8B-Instruct"
  sft_adapter_path: "./checkpoints/sft_checkpoint"
  merged_sft_model_path: "./checkpoints/sft_merged"
  force_merge_sft_adapter: false

  # Run directory
  run_dir: "./runs/video_ppo"

  # GPU allocation (adjust to your hardware)
  train_cuda: "0"
  reward_cuda: "1"
  video_gen_cuda: "2,3"

  # Video generator (Wan2.2) — task / ckpt / size must match (see Wan2.2 SUPPORTED_SIZES).
  # T2V-A14B (default): wan_task t2v-A14B, ckpt Wan2.2-T2V-A14B, e.g. wan_size "1024*704"
  # TI2V-5B (faster, single DiT): wan_task ti2v-5B, ckpt Wan2.2-TI2V-5B, wan_size "1280*704" or "704*1280"
  wan_script_path: "./Wan2.2/generate.py"
  wan_task: "ti2v-5B"
  wan_ckpt_dir: "./checkpoints/Wan2.2-TI2V-5B"
  wan_size: "1280*704"
  wan_frame_num: 50
  wan_sampling_steps: 25
  wan_guide_scale: 5.0
  wan_shift: 5.0
  video_timeout_seconds: 1800
  # --- switch to TI2V-5B (uncomment and comment the T2V block above) ---
  # wan_task: "ti2v-5B"
  # wan_ckpt_dir: "./checkpoints/Wan2.2-TI2V-5B"
  # wan_size: "1280*704"

  # Memory optimization
  offload_model: false
  convert_model_dtype: true
  t5_cpu: false

  # Reward model (VideoReward / VideoAlign) used for g_gc (TA head) and g_ic (VQ+MQ)
  reward_checkpoint: "./checkpoints/VideoReward"
  reward_dtype: "bf16"

  # Temporal consistency reward R_con (paper Eq. 5):
  #   R_con = min(beta, (g_gc - gamma1)/theta1 + (g_ic - gamma2)/theta2)
  temporal_reward:
    gamma1: 0.0     # offset for g_gc (TA against the original seed p_s)
    gamma2: 0.0     # offset for g_ic (VQ + MQ)
    theta1: 1.0     # scale for g_gc
    theta2: 1.0     # scale for g_ic
    beta: 5.0       # clipping upper bound

  # Prompt-level reward R_pmt (paper Eq. 3):
  #   R_pmt = alpha1*(1 - g_t(p_t)) + alpha2*(g_r(p_t) + 1)/2
  prompt_reward:
    enabled: true
    alpha1: 0.5
    alpha2: 0.5
    # Hate-speech classifier g_t (paper [36] Vidgen et al. 2021)
    hate_model_id: "facebook/roberta-hate-speech-dynabench-r4-target"
    # Local sentence encoder T_p(.) for g_r / prototype embedding.
    sentence_encoder_id: "./checkpoints/all-MiniLM-L6-v2"
    # Build prototype from six evenly spaced `output` prompts in SFT data.
    reference_prompts_path: "./data/sft_data.json"
    reference_sample_count: 6

method:
  name: 'ppoconfig'
  # PPO rollout / inner-loop budget — paper does not pin these.
  num_rollouts: 4
  chunk_size: 4
  ppo_epochs: 5
  # init_kl_coef is the lambda in Eq. 6 (KL penalty against G_initial). The
  # paper introduces this term but does not pin its value.
  init_kl_coef: 0.7
  target: 0.1
  horizon: 5000
  # Paper § 4.1: gamma=1.0, lam=0.95 (pinned).
  gamma: 1
  lam: 0.95
  cliprange: 0.1
  cliprange_value: 0.1
  scale_reward: null
  ref_mean: null
  ref_std: null
  cliprange_reward: 1.0
  vf_coef: 1.0
  # Sampling-based rollouts. PPO needs sample variance (so the advantage has
  # signal) and transformers>=5 moved Group Beam Search out of core into a
  # remote `custom_generate` repo, which we deliberately avoid. If you want
  # to revisit beam search later, set `do_sample=False`, pick `num_beams>1`
  # WITHOUT `num_beam_groups`, and pass `custom_generate=...` explicitly.
  gen_kwargs:
    max_new_tokens: 100
    min_new_tokens: 16
    do_sample: False
  gen_experience_kwargs:
    max_new_tokens: 100
    min_new_tokens: 16
    do_sample: True
    temperature: 0.7
    top_p: 0.9
    top_k: 50
