model:
  model_path: "./checkpoints/sft_checkpoint"  # Path to Stage 1 SFT checkpoint
  num_layers_unfrozen: 2
  model_extra_configs:
    attn_implementation: "eager"

tokenizer:
  tokenizer_path: "./checkpoints/sft_checkpoint"
  padding_side: "left"
  truncation_side: "right"
  tokenizer_extra_configs: {}

optimizer:
  name: "adamw"
  kwargs:
    lr: 1.0e-6
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8

scheduler:
  name: "cosine_annealing"
  kwargs:
    T_max: 500
    eta_min: 1.0e-7

train:
  seq_length: 256
  epochs: 3
  total_steps: 500
  batch_size: 1
  max_batches: 200
  trainer: "AcceleratePPOTrainer"
  tracker: null
  checkpoint_interval: 500
  eval_interval: 64
  pipeline: "PromptPipeline"
  checkpoint_dir: "./checkpoints/ppo"
  logging_dir: "./runs/log_dir"

accelerate:
  compute_environment: "LOCAL_MACHINE"
  distributed_type: "NO"
  downcast_bf16: "no"
  gpu_ids: "0"
  machine_rank: 0
  main_training_function: "main"
  mixed_precision: "bf16"
  num_machines: 1
  num_processes: 1
  rdzv_backend: "static"
  same_network: true
  tpu_env: []
  tpu_use_cluster: false
  tpu_use_sudo: false
  use_cpu: false

video:
  # Data
  data_path: "./data/ppo_data.json"

  # Run directory
  run_dir: "./runs/video_ppo"

  # GPU allocation (adjust to your hardware)
  train_cuda: "0"
  reward_cuda: "1"
  video_gen_cuda: "2,3"

  # Video generator (Wan2.2)
  wan_script_path: "./Wan2.2/generate.py"
  wan_task: "t2v-A14B"
  wan_ckpt_dir: "./checkpoints/Wan2.2-T2V-A14B"
  wan_size: "1024*704"
  wan_frame_num: 50
  video_timeout_seconds: 1800

  # Memory optimization
  offload_model: false
  convert_model_dtype: true
  t5_cpu: false

  # Reward model (VideoReward / VideoAlign) used for g_gc (TA head) and g_ic (VQ+MQ)
  reward_checkpoint: "./checkpoints/VideoReward"
  reward_dtype: "bf16"

  # Temporal consistency reward R_con (paper Eq. 5):
  #   R_con = min(beta, (g_gc - gamma1)/theta1 + (g_ic - gamma2)/theta2)
  temporal_reward:
    gamma1: 0.0     # offset for g_gc (TA against the original seed p_s)
    gamma2: 0.0     # offset for g_ic (VQ + MQ)
    theta1: 1.0     # scale for g_gc
    theta2: 1.0     # scale for g_ic
    beta: 5.0       # clipping upper bound

  # Prompt-level reward R_pmt (paper Eq. 3):
  #   R_pmt = alpha1*(1 - g_t(p_t)) + alpha2*(g_r(p_t) + 1)/2
  prompt_reward:
    enabled: true
    alpha1: 0.5
    alpha2: 0.5
    # Hate-speech classifier g_t (paper [36] Vidgen et al. 2021)
    hate_model_id: "facebook/roberta-hate-speech-dynabench-r4-target"
    # Sentence encoder T_p(.) for the prototype embedding
    sentence_encoder_id: "sentence-transformers/all-MiniLM-L6-v2"
    # Optional path to reference temporal-style prompts used to build the
    # prototype. Accepts .txt (one per line) or .json/.jsonl with an
    # 'output'/'prompt'/'text' field. If omitted, the trainer falls back to
    # the `output` field of the PPO/SFT dataset.
    reference_prompts_path: null

method:
  name: 'ppoconfig'
  num_rollouts: 4
  chunk_size: 4
  ppo_epochs: 5
  init_kl_coef: 0.7
  target: 0.1
  horizon: 5000
  gamma: 1
  lam: 0.95
  cliprange: 0.1
  cliprange_value: 0.1
  scale_reward: null
  ref_mean: null
  ref_std: null
  cliprange_reward: 1.0
  vf_coef: 1.0
  # Sampling-based rollouts. PPO needs sample variance (so the advantage has
  # signal) and transformers>=5 moved Group Beam Search out of core into a
  # remote `custom_generate` repo, which we deliberately avoid. If you want
  # to revisit beam search later, set `do_sample=False`, pick `num_beams>1`
  # WITHOUT `num_beam_groups`, and pass `custom_generate=...` explicitly.
  gen_kwargs:
    max_new_tokens: 100
    min_length: 3
    do_sample: True
    temperature: 0.9
    top_p: 0.95
    top_k: 50
